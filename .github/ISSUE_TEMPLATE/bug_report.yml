# Spec 0010 ISS-2: the core bug form.
name: Bug report
description: Something in the server, console, install, or docs doesn't work as it should.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, stop here and use [private reporting](https://github.com/orvanohq/orvano/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orvano version
      description: The image tag, or the output of `orvano --version`.
      placeholder: ghcr.io/orvanohq/orvano:0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Reference compose
        - My own compose or Kubernetes
        - From source
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Server
        - Console
        - Deploy and install
        - Docs
        - Not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove secrets, keys, and personal data first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
        - label: This is not a security vulnerability (those go to private reporting).
          required: true
