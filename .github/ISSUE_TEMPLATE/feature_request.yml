# Spec 0010 ISS-2: the core feature form.
name: Feature request
description: Suggest something Orvano should do.
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        For a bigger idea you want to talk through first, an [Ideas discussion](https://github.com/orvanohq/orvano/discussions/categories/ideas) works well too.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The proposed solution
      description: What you'd like Orvano to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you thought of, or how you work around it now.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Server
        - Console
        - Deploy and install
        - Docs
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and discussions.
          required: true
